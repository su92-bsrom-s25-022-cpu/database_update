<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Database Systems &amp; SQL Quiz (300 MCQs) — Created by Muhammad Waleed</title>
  <style>
    :root {
      --bg-color: #f3f5f9;
      --surface-color: #ffffff;
      --surface-alt: #f8fafc;
      --text-primary: #1e293b;
      --text-secondary: #475569;
      --border-color: #e2e8f0;
      --accent: #2563eb;
      --accent-hover: #1d4ed8;
      --correct-bg: #dcfce7;
      --correct-border: #16a34a;
      --correct-text: #14532d;
      --wrong-bg: #fee2e2;
      --wrong-border: #dc2626;
      --wrong-text: #7f1d1d;
      --shadow: 0 4px 14px rgba(15, 23, 42, 0.06);
      --header-bg: rgba(255, 255, 255, 0.92);
    }

    body.dark-mode {
      --bg-color: #0b1120;
      --surface-color: #111827;
      --surface-alt: #1e293b;
      --text-primary: #f1f5f9;
      --text-secondary: #94a3b8;
      --border-color: #334155;
      --accent: #3b82f6;
      --accent-hover: #60a5fa;
      --correct-bg: rgba(22, 163, 74, 0.22);
      --correct-border: #22c55e;
      --correct-text: #bbf7d0;
      --wrong-bg: rgba(220, 38, 38, 0.22);
      --wrong-border: #ef4444;
      --wrong-text: #fecaca;
      --shadow: 0 4px 16px rgba(0, 0, 0, 0.45);
      --header-bg: rgba(17, 24, 39, 0.92);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-primary);
      line-height: 1.55;
      transition: background-color 0.25s ease, color 0.25s ease;
    }

    .navbar {
      position: sticky;
      top: 0;
      z-index: 1000;
      background: var(--header-bg);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border-color);
      padding: 14px 20px;
      box-shadow: var(--shadow);
    }

    .navbar-inner {
      max-width: 960px;
      margin: 0 auto;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .brand h1 { font-size: 1.2rem; font-weight: 700; color: var(--text-primary); }
    .brand .author { font-size: 0.85rem; font-weight: 600; color: var(--accent); }

    .stats-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }

    .stat-pill {
      background: var(--surface-alt);
      border: 1px solid var(--border-color);
      padding: 6px 12px;
      border-radius: 999px;
      font-size: 0.85rem;
      font-weight: 600;
    }

    .stat-pill.correct { color: #16a34a; border-color: rgba(22, 163, 74, 0.4); }
    .stat-pill.wrong { color: #dc2626; border-color: rgba(220, 38, 38, 0.4); }
    body.dark-mode .stat-pill.correct { color: #4ade80; }
    body.dark-mode .stat-pill.wrong { color: #f87171; }

    .controls { display: flex; align-items: center; gap: 8px; }

    button.btn {
      cursor: pointer;
      border: 1px solid var(--border-color);
      background: var(--surface-color);
      color: var(--text-primary);
      padding: 7px 14px;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 600;
      transition: all 0.2s ease;
    }

    button.btn:hover { border-color: var(--accent); color: var(--accent); }
    button.btn-primary { background: var(--accent); color: #ffffff; border-color: var(--accent); }
    button.btn-primary:hover { background: var(--accent-hover); color: #ffffff; }

    .progress-wrap {
      max-width: 960px;
      margin: 10px auto 0;
      height: 6px;
      background: var(--border-color);
      border-radius: 999px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--accent), #10b981);
      transition: width 0.3s ease;
    }

    .container { max-width: 960px; margin: 24px auto 60px; padding: 0 16px; }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 20px;
      background: var(--surface-color);
      padding: 14px;
      border-radius: 12px;
      border: 1px solid var(--border-color);
      box-shadow: var(--shadow);
    }

    .toolbar input, .toolbar select {
      background: var(--surface-alt);
      color: var(--text-primary);
      border: 1px solid var(--border-color);
      padding: 9px 12px;
      border-radius: 8px;
      font-size: 0.9rem;
      outline: none;
    }

    .toolbar input { flex: 1 1 240px; }
    .toolbar input:focus, .toolbar select:focus { border-color: var(--accent); }

    .mcq-card {
      background: var(--surface-color);
      border: 1px solid var(--border-color);
      border-radius: 14px;
      padding: 20px;
      margin-bottom: 16px;
      box-shadow: var(--shadow);
    }

    .mcq-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 10px;
    }

    .q-badge {
      background: rgba(37, 99, 235, 0.12);
      color: var(--accent);
      font-size: 0.78rem;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 999px;
    }

    .q-status { font-size: 0.82rem; font-weight: 700; }
    .q-status.ok { color: #16a34a; }
    .q-status.bad { color: #dc2626; }
    body.dark-mode .q-status.ok { color: #4ade80; }
    body.dark-mode .q-status.bad { color: #f87171; }

    .question-text {
      font-size: 1rem;
      font-weight: 600;
      margin-bottom: 14px;
      color: var(--text-primary);
    }

    .options-list { display: grid; grid-template-columns: 1fr; gap: 9px; }

    .option-btn {
      display: flex;
      align-items: center;
      gap: 12px;
      width: 100%;
      text-align: left;
      background: var(--surface-alt);
      border: 1px solid var(--border-color);
      color: var(--text-primary);
      padding: 11px 14px;
      border-radius: 10px;
      font-size: 0.93rem;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .option-btn:hover:not(:disabled) {
      border-color: var(--accent);
      background: rgba(37, 99, 235, 0.06);
    }

    .option-btn:disabled { cursor: default; }

    .opt-key {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 26px;
      height: 26px;
      border-radius: 6px;
      background: var(--surface-color);
      border: 1px solid var(--border-color);
      font-weight: 700;
      font-size: 0.82rem;
      color: var(--accent);
    }

    .opt-text { flex: 1; }
    .opt-icon { font-weight: 700; font-size: 0.95rem; }

    .option-btn.correct-choice {
      background: var(--correct-bg);
      border-color: var(--correct-border);
      color: var(--correct-text);
      font-weight: 600;
    }

    .option-btn.correct-choice .opt-key {
      background: var(--correct-border);
      color: #fff;
      border-color: var(--correct-border);
    }

    .option-btn.wrong-choice {
      background: var(--wrong-bg);
      border-color: var(--wrong-border);
      color: var(--wrong-text);
      font-weight: 600;
    }

    .option-btn.wrong-choice .opt-key {
      background: var(--wrong-border);
      color: #fff;
      border-color: var(--wrong-border);
    }

    #scrollTopBtn {
      display: none;
      position: fixed;
      bottom: 24px;
      right: 24px;
      z-index: 999;
      background: var(--accent);
      color: #fff;
      border: none;
      padding: 11px 15px;
      border-radius: 999px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: var(--shadow);
    }
  </style>
</head>
<body>
  <nav class="navbar">
    <div class="navbar-inner">
      <div class="brand">
        <h1>Database Systems &amp; SQL Quiz (300 MCQs)</h1>
        <div class="author">Created by Muhammad Waleed</div>
      </div>
      <div class="stats-bar">
        <span class="stat-pill" id="statAttempted">Attempted: 0 / 300</span>
        <span class="stat-pill correct" id="statCorrect">Correct: 0</span>
        <span class="stat-pill wrong" id="statWrong">Wrong: 0</span>
        <span class="stat-pill" id="statScore">Score: 0%</span>
      </div>
      <div class="controls">
        <button type="button" class="btn" id="darkModeToggle">🌙 Dark Mode</button>
        <button type="button" class="btn btn-primary" id="resetQuizBtn">↻ Shuffle &amp; Reset</button>
      </div>
    </div>
    <div class="progress-wrap"><div class="progress-fill" id="progressFill"></div></div>
  </nav>

  <main class="container">
    <div class="toolbar">
      <input type="text" id="searchInput" placeholder="Search SQL keyword (e.g., HAVING, NULL, CHECK, JOIN)..." />
      <select id="filterSelect">
        <option value="all">All Questions (300)</option>
        <option value="demo">Demo Questions Only (15)</option>
        <option value="unanswered">Unanswered Only</option>
        <option value="correct">Correct Only</option>
        <option value="wrong">Wrong Only</option>
      </select>
    </div>
    <div id="quizContainer"></div>
  </main>

  <button type="button" id="scrollTopBtn" title="Back to top">↑ Top</button>

  <script>
    const sourceMCQs = [
      { id: 1, demo: true, q: "The Credits column of the Course table contains 3, 4, 3, 2 and 4. What does SELECT SUM(Credits) FROM Course WHERE Credits > 2; return?", options: { A: "16", B: "10", C: "14", D: "4" }, answer: "C" },
      { id: 2, demo: true, q: "Teacher has these rows (Dept, Salary): (CS, 50000), (CS, 60000), (Math, 40000), (Math, NULL). In the result of SELECT Dept, AVG(Salary) FROM Teacher GROUP BY Dept; what is the average for Math?", options: { A: "40000", B: "20000", C: "NULL", D: "50000" }, answer: "A" },
      { id: 3, demo: true, q: "Course titles are 'Database Systems', 'Data Mining', 'Big Data' and 'Networks'. How many rows does SELECT Title FROM Course WHERE Title LIKE 'Data%'; return?", options: { A: "1", B: "3", C: "4", D: "2" }, answer: "D" },
      { id: 4, demo: true, q: "The Fee column of Admission has the values 1000, 1500, 2000 and 2500. How many rows match WHERE Fee BETWEEN 1500 AND 2500?", options: { A: "2", B: "3", C: "4", D: "1" }, answer: "B" },
      { id: 5, demo: true, q: "Hotel room rates are 8000, 5000, 12000 and 6000. What does SELECT Rate FROM Hotel ORDER BY Rate LIMIT 2; return (MySQL)?", options: { A: "5000 and 6000", B: "12000 and 8000", C: "8000 and 5000", D: "5000 and 12000" }, answer: "A" },
      { id: 6, demo: true, q: "Which statement is correct about WHERE and HAVING?", options: { A: "WHERE filters groups and HAVING filters rows", B: "Both can only be used without GROUP BY", C: "WHERE filters rows before grouping, and HAVING filters groups after grouping", D: "HAVING must always come before WHERE" }, answer: "C" },
      { id: 7, demo: true, q: "The Stock column of Item has the values 10, 0 and 5. After running UPDATE Item SET Stock = Stock + 5 WHERE Stock < 6; what does SELECT SUM(Stock) FROM Item; return?", options: { A: "15", B: "20", C: "30", D: "25" }, answer: "D" },
      { id: 8, demo: true, q: "A Student table has 6 rows with ages 17, 18, 19, 20, 21 and 22. After DELETE FROM Student WHERE Age NOT BETWEEN 18 AND 21; how many rows remain?", options: { A: "2", B: "4", C: "6", D: "3" }, answer: "B" },
      { id: 9, demo: true, q: "The Phone column of Customer has the values '0300', NULL, '0321' and NULL. What does SELECT COUNT(*) FROM Customer WHERE Phone = NULL; return?", options: { A: "0", B: "2", C: "4", D: "NULL" }, answer: "A" },
      { id: 10, demo: true, q: "A table is created as Course(CourseID INT PRIMARY KEY, Title VARCHAR(50) NOT NULL, Credits INT CHECK (Credits BETWEEN 1 AND 4)). Which insert fails?", options: { A: "INSERT INTO Course VALUES (1, 'DB', 3);", B: "INSERT INTO Course VALUES (3, 'OS', 1);", C: "INSERT INTO Course VALUES (4, 'ML', 4);", D: "INSERT INTO Course VALUES (2, 'AI', 5);" }, answer: "D" },
      { id: 11, demo: true, q: "Course.TeacherID is a foreign key that references Teacher.TeacherID. Which table must be created first?", options: { A: "Course", B: "Both tables must be created in the same statement", C: "Teacher", D: "The order does not matter" }, answer: "C" },
      { id: 12, demo: true, q: "A designer wants the Grade column to accept only A, B, C, D or F. Which column definition is correct?", options: { A: "Grade CHAR(1) DEFAULT ('A','B','C','D','F')", B: "Grade CHAR(1) CHECK (Grade IN ('A','B','C','D','F'))", C: "Grade CHAR(1) UNIQUE ('A','B','C','D','F')", D: "Grade CHAR(1) CHECK (Grade = 'A','B','C','D','F')" }, answer: "B" },
      { id: 13, demo: true, q: "A Person table has these rows (City, Age): (Lahore, 17), (Karachi, 25), (Lahore, 22), (Multan, 30). How many rows does WHERE City = 'Lahore' OR City = 'Multan' AND Age < 25 return?", options: { A: "2", B: "3", C: "1", D: "0" }, answer: "A" },
      { id: 14, demo: true, q: "The Orders table has these rows (CustomerID, Amount): (C1, 100), (C1, 200), (C2, 50), (C3, 300), (C3, 100). Which customers does SELECT CustomerID FROM Orders GROUP BY CustomerID HAVING SUM(Amount) > 250; return?", options: { A: "C3 only", B: "C1, C2 and C3", C: "C2 only", D: "C1 and C3" }, answer: "D" },
      { id: 15, demo: true, q: "Which statement changes the STRUCTURE of a table instead of its data?", options: { A: "UPDATE Course SET Credits = 3;", B: "INSERT INTO Course VALUES (5, 'AI', 3);", C: "ALTER TABLE Course ADD Fee INT;", D: "DELETE FROM Course WHERE Credits = 1;" }, answer: "C" },
      { id: 16, q: "The Level column of Course has the values 100, 200, 300 and 400. How many rows match WHERE Level BETWEEN 200 AND 400?", options: { A: "1", B: "3", C: "4", D: "2" }, answer: "B" },
      { id: 17, q: "The GuardianPhone column of Student has the values '0301', NULL, NULL, '0312' and NULL. What does SELECT COUNT(*) FROM Student WHERE GuardianPhone != NULL; return?", options: { A: "NULL", B: "3", C: "2", D: "0" }, answer: "D" },
      { id: 18, q: "Log Level values are 'ERROR', 'WARN', 'INFO' and 'DEBUG'. How many rows does SELECT Level FROM Log WHERE Level LIKE '____'; return?", options: { A: "2", B: "3", C: "1", D: "4" }, answer: "A" },
      { id: 19, q: "A Room table has these rows (Type, Rent): (Single, 3000), (Suite, 9000), (Single, 4500), (Double, 5000). How many rows does WHERE Type = 'Single' OR Type = 'Double' AND Rent > 6000 return?", options: { A: "0", B: "2", C: "3", D: "1" }, answer: "B" },
      { id: 20, q: "Parcel Weight values are 15, 4, 9 and 2. What does SELECT Weight FROM Parcel ORDER BY Weight LIMIT 2; return (MySQL)?", options: { A: "2 and 4", B: "15 and 4", C: "15 and 9", D: "4 and 2" }, answer: "A" },
      { id: 21, q: "Student has 4 rows and Enrollment has 0 rows. How many rows does SELECT * FROM Student INNER JOIN Enrollment ON Student.ID = Enrollment.StudentID; return?", options: { A: "1", B: "4", C: "0", D: "NULL" }, answer: "C" },
      { id: 22, q: "The Sales table has these rows (Salesperson, Amount): (Ali, 200), (Ali, 300), (Sara, 150), (Zain, 400), (Zain, 250). Which groups does SELECT Salesperson FROM Sales GROUP BY Salesperson HAVING SUM(Amount) > 450; return?", options: { A: "Ali and Zain", B: "Zain only", C: "Ali, Sara and Zain", D: "Ali only" }, answer: "A" },
      { id: 23, q: "Table A has 4 rows and Table B has 3 rows. How many rows does SELECT * FROM A CROSS JOIN B; return?", options: { A: "7", B: "12", C: "4", D: "3" }, answer: "B" },
      { id: 24, q: "What is a composite primary key?", options: { A: "A primary key formed by combining two or more columns to uniquely identify a row", B: "A column that stores both numbers and text", C: "Two separate primary keys in the same table", D: "A primary key that also acts as a CHECK constraint" }, answer: "A" },
      { id: 25, q: "Product Code values are 'P-101', 'P-202', 'X-101' and 'P-3005'. How many rows does SELECT Code FROM Product WHERE Code LIKE 'P-___'; return?", options: { A: "1", B: "2", C: "3", D: "4" }, answer: "B" },
      { id: 26, q: "What does Second Normal Form (2NF) eliminate?", options: { A: "Primary keys", B: "All foreign keys", C: "Atomic attributes", D: "Partial dependencies (non-key attributes depending on only part of a composite primary key)" }, answer: "D" },
      { id: 27, q: "A Room table has these rows (Type, Rent): (Single, 3000), (Suite, 9000), (Single, 4500), (Double, 5000). How many rows does WHERE (Type = 'Single' OR Type = 'Double') AND Rent > 6000 return?", options: { A: "2", B: "1", C: "0", D: "3" }, answer: "C" },
      { id: 28, q: "The Company column of Visitor has the values 'ABC', NULL, NULL and NULL. What does SELECT COUNT(*) FROM Visitor WHERE Company = NULL; return?", options: { A: "0", B: "NULL", C: "1", D: "3" }, answer: "A" },
      { id: 29, q: "A table is created as Discount(Code VARCHAR(10) PRIMARY KEY, Percent INT CHECK (Percent BETWEEN 5 AND 50)). Which insert fails?", options: { A: "INSERT INTO Discount VALUES ('SAVE5', 5);", B: "INSERT INTO Discount VALUES ('FREE', 100);", C: "INSERT INTO Discount VALUES ('DEAL20', 20);", D: "INSERT INTO Discount VALUES ('HALF', 50);" }, answer: "B" },
      { id: 30, q: "The Hours column of Task has the values 3, 6 and 9. After running UPDATE Task SET Hours = Hours * 2 WHERE Hours < 5; what does SELECT SUM(Hours) FROM Task; return?", options: { A: "36", B: "24", C: "21", D: "18" }, answer: "C" },
      { id: 31, q: "Which query finds all Customers who have NEVER placed an order (assuming Customer.ID and Orders.CustomerID)?", options: { A: "SELECT Customer.* FROM Customer RIGHT JOIN Orders ON Customer.ID = Orders.CustomerID;", B: "SELECT Customer.* FROM Customer INNER JOIN Orders ON Customer.ID = Orders.CustomerID WHERE Orders.CustomerID IS NULL;", C: "SELECT Customer.* FROM Customer CROSS JOIN Orders WHERE Orders.CustomerID = NULL;", D: "SELECT Customer.* FROM Customer LEFT JOIN Orders ON Customer.ID = Orders.CustomerID WHERE Orders.CustomerID IS NULL;" }, answer: "D" },
      { id: 32, q: "The Tier column of Account has the values 1, 2, 3 and 4. How many rows match WHERE Tier BETWEEN 2 AND 5?", options: { A: "1", B: "2", C: "4", D: "3" }, answer: "D" },
      { id: 33, q: "The Allergy column of Patient has the values 'Dust', NULL, 'Pollen', NULL and NULL. What does SELECT COUNT(*) FROM Patient WHERE Allergy IS NULL; return?", options: { A: "2", B: "3", C: "0", D: "5" }, answer: "B" },
      { id: 34, q: "A Book table has 6 rows with years 2015, 2017, 2019, 2020, 2022 and 2024. After DELETE FROM Book WHERE Year NOT BETWEEN 2018 AND 2023; how many rows remain?", options: { A: "2", B: "6", C: "3", D: "4" }, answer: "C" },
      { id: 35, q: "A Order table has 6 rows with statuses 'New', 'Paid', 'New', 'Shipped', 'Paid' and 'Cancelled'. After DELETE FROM Order WHERE Status = 'New'; how many rows remain?", options: { A: "2", B: "5", C: "3", D: "4" }, answer: "D" },
      { id: 36, q: "The Review table has these rows (ProductID, Stars): (P1, 5), (P1, 3), (P2, 2), (P2, 4), (P3, 5), (P3, 5). Which groups does SELECT ProductID FROM Review GROUP BY ProductID HAVING AVG(Stars) >= 4; return?", options: { A: "P1 and P3", B: "P2 and P3", C: "P3 only", D: "P1, P2 and P3" }, answer: "A" },
      { id: 37, q: "The Edition column of Book contains 2, NULL, 3, 4, NULL and 1. What does SELECT COUNT(*) FROM Book; return?", options: { A: "2", B: "NULL", C: "6", D: "4" }, answer: "C" },
      { id: 38, q: "A parent table Department has DeptID values 10 and 20. Employee.DeptID references Department.DeptID. Which insert into Employee fails?", options: { A: "INSERT INTO Employee VALUES (4, 'Hina', NULL);", B: "INSERT INTO Employee VALUES (3, 'Umar', 20);", C: "INSERT INTO Employee VALUES (1, 'Ali', 30);", D: "INSERT INTO Employee VALUES (2, 'Sara', 10);" }, answer: "C" },
      { id: 39, q: "Book Price values are 900, 400, 1200 and 650. What does SELECT Price FROM Book ORDER BY Price DESC LIMIT 2; return (MySQL)?", options: { A: "400 and 1200", B: "400 and 650", C: "900 and 1200", D: "1200 and 900" }, answer: "D" },
      { id: 40, q: "The Hours column of the Project table contains 10, 20, 15, 25 and 30. What does SELECT SUM(Hours) FROM Project WHERE Hours < 25; return?", options: { A: "55", B: "100", C: "45", D: "3" }, answer: "C" },
      { id: 41, q: "How is a many-to-many (M:N) relationship between Student and Course converted into relational tables?", options: { A: "By placing CourseID inside Student only", B: "By creating a junction (bridge) table containing foreign keys from both Student and Course", C: "By merging Student and Course into a single column", D: "By placing StudentID inside Course only" }, answer: "B" },
      { id: 42, q: "The Age column of Employee has the values 22, 25, 30, 35, 40 and 45. How many rows match WHERE Age BETWEEN 25 AND 40?", options: { A: "3", B: "4", C: "2", D: "5" }, answer: "B" },
      { id: 43, q: "Flight Fare values are 25000, 18000, 32000 and 21000. What does SELECT Fare FROM Flight ORDER BY Fare LIMIT 2; return (MySQL)?", options: { A: "18000 and 32000", B: "25000 and 18000", C: "32000 and 25000", D: "18000 and 21000" }, answer: "D" },
      { id: 44, q: "Which of the following is a DML (Data Manipulation Language) command?", options: { A: "DROP TABLE", B: "CREATE TABLE", C: "TRUNCATE TABLE", D: "UPDATE" }, answer: "D" },
      { id: 45, q: "Product Price values are 450, 120, 890 and 300. What does SELECT Price FROM Product ORDER BY Price LIMIT 2; return (MySQL)?", options: { A: "890 and 450", B: "450 and 120", C: "120 and 300", D: "120 and 890" }, answer: "C" },
      { id: 46, q: "The GuardianPhone column of Student has the values '0301', NULL, NULL, '0312' and NULL. What does SELECT COUNT(*) FROM Student WHERE GuardianPhone = NULL; return?", options: { A: "0", B: "NULL", C: "3", D: "2" }, answer: "A" },
      { id: 47, q: "Movie Rating values are 7, 9, 6 and 8. What does SELECT Rating FROM Movie ORDER BY Rating DESC LIMIT 2; return (MySQL)?", options: { A: "6 and 7", B: "9 and 8", C: "7 and 9", D: "8 and 9" }, answer: "B" },
      { id: 48, q: "Which condition is required for two SELECT queries to be combined with UNION?", options: { A: "Both tables must have identical primary key names", B: "Both queries must have the same number of columns with compatible data types", C: "Both queries must select from the exact same table", D: "Neither query can contain a WHERE clause" }, answer: "B" },
      { id: 49, q: "Product Code values are 'P-101', 'P-202', 'X-101' and 'P-3005'. How many rows does SELECT Code FROM Product WHERE Code LIKE 'P-%'; return?", options: { A: "1", B: "3", C: "4", D: "2" }, answer: "B" },

    function shuffleArray(arr) {
      const copy = arr.slice();
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }

    function buildShuffledQuiz() {
      const shuffledQs = shuffleArray(sourceMCQs);
      const keys = ['A', 'B', 'C', 'D'];
      return shuffledQs.map((item, idx) => {
        const entries = shuffleArray(Object.entries(item.options));
        const newOptions = {};
        let newAnswer = 'A';
        entries.forEach(([oldKey, text], pos) => {
          const k = keys[pos];
          newOptions[k] = text;
          if (oldKey === item.answer) newAnswer = k;
        });
        return {
          id: item.id,
          demo: Boolean(item.demo),
          displayNum: idx + 1,
          q: item.q,
          options: newOptions,
          answer: newAnswer
        };
      });
    }

    let quizData = buildShuffledQuiz();
    const userAnswers = {};

    const quizContainer = document.getElementById('quizContainer');
    const searchInput = document.getElementById('searchInput');
    const filterSelect = document.getElementById('filterSelect');
    const darkModeToggle = document.getElementById('darkModeToggle');
    const resetQuizBtn = document.getElementById('resetQuizBtn');
    const scrollTopBtn = document.getElementById('scrollTopBtn');

    function escapeHTML(str) {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function updateStats() {
      const entries = Object.values(userAnswers);
      const attempted = entries.length;
      const correct = entries.filter(x => x.isCorrect).length;
      const wrong = attempted - correct;
      const pct = attempted ? Math.round((correct / attempted) * 100) : 0;

      document.getElementById('statAttempted').textContent = `Attempted: ${attempted} / ${quizData.length}`;
      document.getElementById('statCorrect').textContent = `Correct: ${correct}`;
      document.getElementById('statWrong').textContent = `Wrong: ${wrong}`;
      document.getElementById('statScore').textContent = `Score: ${pct}%`;
      document.getElementById('progressFill').style.width = `${(attempted / quizData.length) * 100}%`;
    }

    function renderQuiz() {
      const query = searchInput.value.trim().toLowerCase();
      const filter = filterSelect.value;

      quizContainer.innerHTML = '';
      const fragment = document.createDocumentFragment();

      quizData.forEach(item => {
        const state = userAnswers[item.id];

        if (filter === 'demo' && !item.demo) return;
        if (filter === 'unanswered' && state) return;
        if (filter === 'correct' && (!state || !state.isCorrect)) return;
        if (filter === 'wrong' && (!state || state.isCorrect)) return;

        if (query) {
          const haystack = (item.q + ' ' + Object.values(item.options).join(' ')).toLowerCase();
          if (!haystack.includes(query)) return;
        }

        const card = document.createElement('div');
        card.className = 'mcq-card';
        card.id = 'mcq-' + item.id;

        let statusHtml = '';
        if (state) {
          statusHtml = state.isCorrect
            ? '<span class="q-status ok">✔ Correct!</span>'
            : `<span class="q-status bad">✘ Wrong (Correct: ${item.answer})</span>`;
        }

        let optionsHtml = '';
        ['A', 'B', 'C', 'D'].forEach(key => {
          let btnClass = 'option-btn';
          let icon = '';
          const disabledAttr = state ? 'disabled' : '';

          if (state) {
            if (key === item.answer) {
              btnClass += ' correct-choice';
              icon = '✔';
            } else if (key === state.selected && !state.isCorrect) {
              btnClass += ' wrong-choice';
              icon = '✘';
            }
          }

          optionsHtml += `
            <button type="button" class="${btnClass}" data-id="${item.id}" data-opt="${key}" ${disabledAttr}>
              <span class="opt-key">${key}</span>
              <span class="opt-text">${escapeHTML(item.options[key])}</span>
              <span class="opt-icon">${icon}</span>
            </button>
          `;
        });

        const demoTag = item.demo ? ' • Demo' : '';
        card.innerHTML = `
          <div class="mcq-header">
            <span class="q-badge">Question #${item.displayNum}${demoTag}</span>
            ${statusHtml}
          </div>
          <div class="question-text">${escapeHTML(item.q)}</div>
          <div class="options-list">${optionsHtml}</div>
        `;

        fragment.appendChild(card);
      });

      if (!fragment.childNodes.length) {
        quizContainer.innerHTML = '<div class="mcq-card" style="text-align:center;color:var(--text-secondary);">No matching MCQs found.</div>';
      } else {
        quizContainer.appendChild(fragment);
      }
    }

    quizContainer.addEventListener('click', (e) => {
      const btn = e.target.closest('.option-btn');
      if (!btn || btn.disabled) return;

      const id = Number(btn.dataset.id);
      const selected = btn.dataset.opt;
      const item = quizData.find(q => q.id === id);
      if (!item || userAnswers[id]) return;

      const isCorrect = selected === item.answer;
      userAnswers[id] = { selected, isCorrect };

      const card = document.getElementById('mcq-' + id);
      const header = card.querySelector('.mcq-header');
      const existingStatus = header.querySelector('.q-status');
      if (existingStatus) existingStatus.remove();

      const statusSpan = document.createElement('span');
      statusSpan.className = 'q-status ' + (isCorrect ? 'ok' : 'bad');
      statusSpan.textContent = isCorrect ? '✔ Correct!' : `✘ Wrong (Correct: ${item.answer})`;
      header.appendChild(statusSpan);

      const allBtns = card.querySelectorAll('.option-btn');
      allBtns.forEach(b => {
        b.disabled = true;
        const optKey = b.dataset.opt;
        const iconEl = b.querySelector('.opt-icon');
        if (optKey === item.answer) {
          b.classList.add('correct-choice');
          iconEl.textContent = '✔';
        } else if (optKey === selected && !isCorrect) {
          b.classList.add('wrong-choice');
          iconEl.textContent = '✘';
        }
      });

      updateStats();
    });

    searchInput.addEventListener('input', renderQuiz);
    filterSelect.addEventListener('change', renderQuiz);

    function applyTheme(isDark) {
      document.body.classList.toggle('dark-mode', isDark);
      darkModeToggle.textContent = isDark ? '☀️ Light Mode' : '🌙 Dark Mode';
      localStorage.setItem('waleed_quiz_dark_mode', isDark ? '1' : '0');
    }

    if (localStorage.getItem('waleed_quiz_dark_mode') === '1') {
      applyTheme(true);
    }

    darkModeToggle.addEventListener('click', () => {
      applyTheme(!document.body.classList.contains('dark-mode'));
    });

    resetQuizBtn.addEventListener('click', () => {
      if (Object.keys(userAnswers).length > 0) {
        if (!confirm('Are you sure you want to reset your score and re-shuffle all MCQs & options?')) return;
      }
      for (const k in userAnswers) delete userAnswers[k];
      quizData = buildShuffledQuiz();
      updateStats();
      renderQuiz();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });

    window.addEventListener('scroll', () => {
      scrollTopBtn.style.display = window.scrollY > 400 ? 'block' : 'none';
    });
    scrollTopBtn.addEventListener('click', () => {
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });

    renderQuiz();
  </script>
</body>
</html>
